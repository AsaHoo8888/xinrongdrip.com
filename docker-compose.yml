services:
  payload:
    build:
      context: .
      dockerfile_inline: |
        FROM node:26.4.0-alpine
        WORKDIR /home/node/app
        COPY . .
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - node_modules:/home/node/app/node_modules
      - ./public/media:/home/node/app/public/media
    working_dir: /home/node/app
    command: sh -c "npm install -g pnpm@10.28.2 && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    env_file:
      - .env

volumes:
  node_modules:
